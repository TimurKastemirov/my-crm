<div class="min-h-dvh flex items-center justify-center bg-slate-50 px-4">
  <form
    [formGroup]="vm.form"
    (ngSubmit)="vm.submit()"
    class="w-full max-w-sm rounded-2xl bg-white p-8 shadow-sm ring-1 ring-slate-200"
  >
    <h1 class="text-2xl font-semibold text-slate-900">{{ 'auth.signInTitle' | translate }}</h1>
    <p class="mt-1 text-sm text-slate-500">{{ 'auth.signInSubtitle' | translate }}</p>

    @if (vm.error()) {
      <div class="mt-4 rounded-lg bg-red-50 px-3 py-2 text-sm text-red-700" role="alert">
        {{ vm.error() }}
      </div>
    }

    <label for="login-email" class="mt-5 block text-sm font-medium text-slate-700">
      {{ 'auth.email' | translate }}
      <input
        id="login-email"
        name="email"
        type="email"
        formControlName="email"
        autocomplete="email"
        class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"
      />
    </label>

    <label for="login-password" class="mt-4 block text-sm font-medium text-slate-700">
      {{ 'auth.password' | translate }}
      <input
        id="login-password"
        name="password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"
      />
    </label>

    <button
      type="submit"
      [disabled]="vm.loading()"
      class="mt-6 w-full rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-medium text-white hover:bg-indigo-500 disabled:opacity-60"
    >
      {{ vm.loading() ? ('auth.signingIn' | translate) : ('auth.signIn' | translate) }}
    </button>

    <p class="mt-4 text-center text-sm text-slate-500">
      {{ 'auth.noAccount' | translate }}
      <a routerLink="/register" class="font-medium text-indigo-600 hover:underline">{{ 'auth.registerTitle' | translate }}</a>
    </p>
  </form>
</div>
