<div class="min-h-dvh flex items-center justify-center bg-slate-50 px-4 py-8">
  <form
    [formGroup]="vm.form"
    (ngSubmit)="vm.submit()"
    class="w-full max-w-sm rounded-2xl bg-white p-8 shadow-sm ring-1 ring-slate-200"
  >
    <h1 class="text-2xl font-semibold text-slate-900">{{ 'auth.registerTitle' | translate }}</h1>
    <p class="mt-1 text-sm text-slate-500">{{ 'auth.registerSubtitle' | translate }}</p>

    @if (vm.error()) {
      <div class="mt-4 rounded-lg bg-red-50 px-3 py-2 text-sm text-red-700" role="alert">
        {{ vm.error() }}
      </div>
    }

    <div class="mt-5 grid grid-cols-2 gap-3">
      <label for="register-first-name" class="block text-sm font-medium text-slate-700">
        {{ 'auth.firstName' | translate }}
        <input id="register-first-name" name="firstName" formControlName="firstName" autocomplete="given-name" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100" />
      </label>
      <label for="register-last-name" class="block text-sm font-medium text-slate-700">
        {{ 'auth.lastName' | translate }}
        <input id="register-last-name" name="lastName" formControlName="lastName" autocomplete="family-name" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100" />
      </label>
    </div>

    <label for="register-organization" class="mt-4 block text-sm font-medium text-slate-700">
      {{ 'auth.organization' | translate }}
      <input id="register-organization" name="organizationName" formControlName="organizationName" autocomplete="organization" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100" />
    </label>

    <label for="register-email" class="mt-4 block text-sm font-medium text-slate-700">
      {{ 'auth.email' | translate }}
      <input id="register-email" name="email" type="email" formControlName="email" autocomplete="email" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100" />
    </label>

    <label for="register-password" class="mt-4 block text-sm font-medium text-slate-700">
      {{ 'auth.password' | translate }}
      <input id="register-password" name="password" type="password" formControlName="password" autocomplete="new-password" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100" />
    </label>

    <button
      type="submit"
      [disabled]="vm.loading()"
      class="mt-6 w-full rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-medium text-white hover:bg-indigo-500 disabled:opacity-60"
    >
      {{ vm.loading() ? ('common.creating' | translate) : ('auth.createAccount' | translate) }}
    </button>

    <p class="mt-4 text-center text-sm text-slate-500">
      {{ 'auth.haveAccount' | translate }}
      <a routerLink="/login" class="font-medium text-indigo-600 hover:underline">{{ 'auth.signIn' | translate }}</a>
    </p>
  </form>
</div>
