<div class="flex h-full flex-col">
  <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
    <h1 class="text-xl font-semibold text-slate-900">Companies</h1>
    <button type="button" (click)="vm.openCreate()" class="rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-medium text-white hover:bg-indigo-500">
      + Company
    </button>
  </div>

  <input
    #box
    id="companies-search"
    name="search"
    aria-label="Search companies"
    (keyup.enter)="vm.applySearch(box.value)"
    placeholder="Search and press Enter…"
    class="mt-4 w-full shrink-0 rounded-lg border border-slate-300 px-3 py-2.5 text-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"
  />

  @if (vm.error()) {
    <div class="mt-4 shrink-0 rounded-lg bg-red-50 px-3 py-2 text-sm text-red-700" role="alert">{{ vm.error() }}</div>
  }

  @if (vm.loading()) {
    <p class="mt-4 flex min-h-0 flex-1 items-center justify-center text-sm text-slate-400">Loading…</p>
  } @else if (vm.items().length === 0) {
    <div class="mt-4 flex min-h-0 flex-1 items-center justify-center rounded-xl border border-dashed border-slate-300 bg-white p-10 text-center text-sm text-slate-400">
      No companies yet
    </div>
  } @else {
    <div class="mt-4 grid min-h-0 flex-1 grid-cols-1 content-start gap-3 overflow-auto md:grid-cols-2 lg:grid-cols-3">
      @for (c of vm.items(); track c.id) {
        <div class="flex flex-col rounded-xl bg-white p-4 shadow-sm ring-1 ring-slate-200">
          <div class="font-medium text-slate-900">{{ c.name }}</div>
          @if (c.industry) { <div class="mt-0.5 text-sm text-slate-500">{{ c.industry }}</div> }
          @if (c.website) { <div class="mt-0.5 truncate text-sm text-indigo-600">{{ c.website }}</div> }
          <div class="mt-3 flex gap-2">
            <button type="button" (click)="vm.openEdit(c)" class="rounded-lg border border-slate-300 px-3 py-2 text-sm text-slate-600 hover:bg-slate-50">Edit</button>
            <button type="button" (click)="vm.remove(c)" class="rounded-lg border border-red-200 px-3 py-2 text-sm text-red-600 hover:bg-red-50">Delete</button>
          </div>
        </div>
      }
    </div>
    <div class="mt-4 shrink-0">
      <app-paginator [page]="vm.page()" [total]="vm.total()" [hasNext]="vm.hasNext()" (pageChange)="vm.goPage($event)" />
    </div>
  }
</div>

<app-modal [open]="vm.modalOpen()" [title]="vm.editingId() ? 'Edit company' : 'New company'" (close)="vm.modalOpen.set(false)">
  <form [formGroup]="vm.form" (ngSubmit)="vm.save()">
    <label for="company-name" class="block text-sm font-medium text-slate-700">
      Name
      <input id="company-name" name="name" formControlName="name" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100" />
    </label>
    <label for="company-website" class="mt-3 block text-sm font-medium text-slate-700">
      Website
      <input id="company-website" name="website" formControlName="website" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100" />
    </label>
    <label for="company-industry" class="mt-3 block text-sm font-medium text-slate-700">
      Industry
      <input id="company-industry" name="industry" formControlName="industry" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100" />
    </label>
    <label for="company-size" class="mt-3 block text-sm font-medium text-slate-700">
      Size
      <input id="company-size" name="size" formControlName="size" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100" />
    </label>

    <div class="mt-5 flex gap-2">
      <button type="submit" [disabled]="vm.saving()" class="flex-1 rounded-lg bg-indigo-600 py-2.5 text-sm font-medium text-white hover:bg-indigo-500 disabled:opacity-60">
        {{ vm.saving() ? 'Saving…' : 'Save' }}
      </button>
      <button type="button" (click)="vm.modalOpen.set(false)" class="rounded-lg border border-slate-300 px-4 py-2.5 text-sm text-slate-600">Cancel</button>
    </div>
  </form>
</app-modal>
