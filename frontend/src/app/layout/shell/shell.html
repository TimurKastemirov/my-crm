<div class="flex h-dvh flex-col bg-slate-50 text-slate-800">
  <header class="flex items-center gap-3 border-b border-slate-200 bg-white px-4 py-3">
    <button
      type="button"
      class="-ml-1 rounded-lg p-2 text-slate-600 hover:bg-slate-100 sm:hidden"
      (click)="vm.menuOpen.set(true)"
      aria-label="Open menu"
    >
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round" />
      </svg>
    </button>
    <span class="text-lg font-semibold text-indigo-600">CRM</span>
    <div class="ml-auto flex items-center gap-3">
      <span class="hidden max-w-[40vw] truncate text-sm text-slate-500 sm:inline">{{ vm.user()?.email }}</span>
      <button type="button" (click)="vm.logout()" class="rounded-lg px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100">Sign out</button>
    </div>
  </header>

  <div class="flex min-h-0 flex-1">
    <aside class="hidden w-56 shrink-0 overflow-y-auto border-r border-slate-200 bg-white p-4 sm:block">
      <nav class="flex flex-col gap-1">
        @for (item of vm.nav; track item.path) {
          <a
            [routerLink]="item.path"
            routerLinkActive="bg-indigo-50 text-indigo-700"
            [routerLinkActiveOptions]="{ exact: item.path === '/' }"
            class="rounded-lg px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100"
          >{{ item.label }}</a>
        }
      </nav>
    </aside>

    @if (vm.menuOpen()) {
      <div class="fixed inset-0 z-40 sm:hidden">
        <div class="absolute inset-0 bg-black/40" (click)="vm.menuOpen.set(false)"></div>
        <nav class="absolute left-0 top-0 flex h-full w-64 flex-col gap-1 bg-white p-4 shadow-xl">
          <div class="mb-4 px-2 text-lg font-semibold text-indigo-600">CRM</div>
          @for (item of vm.nav; track item.path) {
            <a
              [routerLink]="item.path"
              (click)="vm.menuOpen.set(false)"
              routerLinkActive="bg-indigo-50 text-indigo-700"
              [routerLinkActiveOptions]="{ exact: item.path === '/' }"
              class="rounded-lg px-3 py-3 text-sm font-medium text-slate-600 hover:bg-slate-100"
            >{{ item.label }}</a>
          }
        </nav>
      </div>
    }

    <main class="min-h-0 flex-1 overflow-auto p-4 sm:p-6">
      <router-outlet />
    </main>
  </div>
</div>
