<select
  [id]="controlId()"
  name="language"
  (change)="change($any($event.target).value)"
  [attr.aria-label]="'lang.label' | translate"
  class="rounded-lg border border-slate-300 bg-white px-2 py-1.5 text-sm text-slate-600 outline-none focus:border-indigo-500"
>
  @for (l of options; track l) {
    <!-- [selected] per option, not [value] on the select: options rendered by @for would show the first one. -->
    <option [value]="l" [selected]="l === current()">{{ 'lang.' + l | translate }}</option>
  }
</select>
